<svg width="560" height="140" viewBox="0 0 560 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDF Template Designer">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <rect x="10" y="10" width="120" height="120" rx="26" fill="url(#tile)"/>

  <!-- Document -->
  <path d="M40 30 h48 l16 16 v64 a4 4 0 0 1 -4 4 h-60 a4 4 0 0 1 -4 -4 v-76 a4 4 0 0 1 4 -4 z" fill="#FFFFFF"/>
  <path d="M88 30 v12 a4 4 0 0 0 4 4 h12 z" fill="#C7D2FE"/>

  <!-- Template fields on the document -->
  <rect x="50" y="56" width="42" height="8" rx="2" fill="#C7D2FE"/>
  <!-- selected field with handles -->
  <rect x="50" y="72" width="52" height="14" rx="2" fill="#E0F2FE" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="50" cy="72" r="3" fill="#0EA5E9"/>
  <circle cx="102" cy="72" r="3" fill="#0EA5E9"/>
  <circle cx="50" cy="86" r="3" fill="#0EA5E9"/>
  <circle cx="102" cy="86" r="3" fill="#0EA5E9"/>
  <rect x="50" y="94" width="30" height="8" rx="2" fill="#C7D2FE"/>

  <!-- Wordmark -->
  <text x="152" y="66" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" fill="#6366F1">PDF Template</text>
  <text x="152" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="600" fill="#0EA5E9">Designer</text>
</svg>
